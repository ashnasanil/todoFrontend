<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow p-4" style="width:450px">
    <h2 class="text-center mb-4">Create Account</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div *ngIf="errorMessage()" class="alert alert-danger p-2 mb-3 small">
        {{ errorMessage() }}
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Name" formControlName="name">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" formControlName="email">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Password" formControlName="password">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword">
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">Register</button>
    </form>
    <div class="text-center mt-3">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
